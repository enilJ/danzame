titolo: PRIMAVERADANZA
anno: 2017
luogo: Sicilia
prima: 29 aprile-1 maggio 2017
organico: 8+25 danzatori
compagnia: ORMA DANCE COMPANY
musica: Collage
repliche:
- Teatro MASD, RG.
citazioni:
- testo: "L’azzurro del cielo nasce dal verde del mare, laggiù. La Festa dei Fiori spande profumi inebrianti perfino nei vicoli del centro. Farfalle esotiche spiegano le ali al sole, mentre saettano sinuose le libellule iridescenti. Da quella finestra aperta, nel caos cosmico, irrompono spirali voluttuose, giravolte ardite, evoluzioni ammalianti, rimbalzi e sospensioni mozzafiato. Nel sogno a occhi aperti la realtà si fa carne viva pulsante, oltre la silhouette del desiderio. Quei corpi in movimento sono passione, bellezza, emozione. Germogliano performance che esaltano angoli nascosti della usuale promenade. Nella memoria ritorna l’invasione gioiosa della PrimaVeraDanza. Sensazioni forti, vitali, vissute a spasso fra la festa dei fiori colorati: una boccata d’ossigeno per la mia città."
  fonte: Francesco A. Musmeci
note:
- "Balconi e piattaforme: 6 danzatori, musica Mix per Festival dei Fiori"
