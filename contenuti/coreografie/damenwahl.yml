titolo: Damenwahl
anno: 1994
luogo: Svizzera
prima: 13 febbraio 1994, STADTTHEATER LUZERN, CH
organico: 12 danzatori con orchestra
compagnia: STADTTHEATER LUZERN
musica: Anton Dvořák
citazioni:
- testo: La vera sorpresa della serata è la coreografia "Damenwahl" di Enrico Musmeci, che mostra la serenata per orchestra d'archi di Anton Dvořák da una prospettiva insolitamente divertente.
  fonte: Luzerner Zeitung
  traduzione_en: The real surprise of the evening is Enrico Musmeci's choreography "Damenwahl", which shows Antonín Dvořák's Serenade for Strings from an unusually witty angle.
  traduzione_fr: La vraie surprise de la soirée est la chorégraphie « Damenwahl » d'Enrico Musmeci, qui montre la Sérénade pour cordes d'Antonín Dvořák sous un angle étonnamment drôle.
