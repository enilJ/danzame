feat_tagline: Une plateforme chorégraphique d'auteur. « Ce qui est inconnu paraît étrange. »
poster_alt: Affiche du Mò.DANCEFEST 2026
poster_cap: Programme 2026
feat_p1: Le Mò.DANCEFEST sélectionne et présente de courtes pièces de jeunes compagnies siciliennes de danse contemporaine et de chorégraphes siciliens installés à l'étranger. Les œuvres sont inédites ou des extraits retravaillés de créations récentes, choisis pour faire découvrir au public les styles et les tendances de la danse d'aujourd'hui.
feat_p2: Le festival est conçu et organisé par DANZ@M.E et se déroule dans la salle de l'association, La Pépinière. Autour des soirées de spectacle, il propose des masterclasses, des laboratoires chorégraphiques et des résidences, qui se terminent par une présentation publique.
