seasons_h: Saisons
seasons:
- anno: '1983'
  luogo: Cannes
  teatro: Centre Rosella Hightower
  testo: Cycle professionnel de deux ans en danse classique et moderne.
- anno: '1985'
  luogo: Nice · Avignon · Nancy
  teatro: Opéra de Nice, Opéra d'Avignon, Ballet de Nancy
  testo: Premiers contrats dans les ballets des opéras français.
- anno: '1986'
  luogo: Europe · États-Unis
  teatro: Ballet Théâtre Populaire en Liberté, Ballet de France
  testo: Tournée européenne puis, en 1987, aux États-Unis avec le Ballet de France de Paris.
- anno: '1987'
  luogo: Turin
  teatro: Teatro Regio
  testo: Une saison dans le corps de ballet.
- anno: '1988'
  luogo: Zurich
  teatro: Ballet de l'Opernhaus, dir. Uwe Scholz
  testo: Quatre saisons. Dès 1990, il crée ses premières chorégraphies pour l'Opéra.
- anno: '1992'
  luogo: Lucerne
  teatro: Stadttheater
  testo: Deux saisons comme danseur et chorégraphe ; en 1993, il signe une pièce avec orchestre.
- anno: '1995'
  luogo: Zurich
  teatro: ORMA Dance Company
  testo: Il fonde et dirige la compagnie, soutenue par la Ville et le Canton de Zurich. Plus de dix créations, en tournée en Allemagne, en France, à l'île Maurice, en Italie et au Liechtenstein jusqu'en 2000.
- anno: '2010'
  luogo: Catane · Acireale
  teatro: Scenario Pubblico, DANZ@M.E
  testo: Retour en Sicile. Depuis 2012, directeur pédagogique de MoDem Pro et de la CZD2 ; assistant de Roberto Zappalà pour Fra Diavolo à l'Opéra de Rome (2017) et au Teatro Massimo de Palerme (2018).
