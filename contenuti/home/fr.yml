bio_roles: Danseur · chorégraphe · pédagogue
bio_p1: Né à Catane le 4 juillet 1964, il commence la danse classique à neuf ans, entre Acireale et Catane. En 1983, il part en France pour le cycle professionnel de deux ans du Centre de Danse International Rosella Hightower à Cannes.
bio_p2: Suivent quinze années dans les maisons d'opéra de France, d'Italie et de Suisse. Il danse le répertoire de Petipa, Balanchine, Bournonville et Cranko et travaille avec des chorégraphes comme Uwe Scholz, Peter Schaufuss et John Clifford. Il signe ses premières chorégraphies à Zurich et fonde en 1995 l'ORMA Dance Company.
bio_p3: Il collabore avec Roberto Zappalà depuis 1995. De retour en Sicile en 2010, il dirige les cours MoDem Pro et la CZD2 à Scenario Pubblico, à Catane, et avec DANZ@M.E fait venir à Acireale ateliers, résidences et le Mò.DANCEFEST.
