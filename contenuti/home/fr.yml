intro_lede: 'DANZ@M.E fait vivre la danse sous toutes ses formes à Acireale et dans sa région : <em>performances</em>, résidences chorégraphiques, stages et ateliers.'
intro_body: Elle a été fondée par C. Enrico Musmeci, Prix Aci &amp; Galatea 1997, après une carrière dans les maisons d'opéra de France, d'Italie et de Suisse. Au fil des années, l'association a produit des spectacles avec musique live, des performances urbaines et de la danse-théâtre, et a noué des échanges internationaux pour l'insertion professionnelle des jeunes danseurs.
