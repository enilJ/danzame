seasons_h: Seasons
seasons:
- anno: '1983'
  luogo: Cannes
  teatro: Centre Rosella Hightower
  testo: Two-year professional training in classical and modern dance.
- anno: '1985'
  luogo: Nice · Avignon · Nancy
  teatro: Opéra de Nice, Opéra d'Avignon, Ballet de Nancy
  testo: First contracts with French opera ballet companies.
- anno: '1986'
  luogo: Europe · United States
  teatro: Ballet Théâtre Populaire en Liberté, Ballet de France
  testo: European tour and, in 1987, a US tour with the Ballet de France, Paris.
- anno: '1987'
  luogo: Turin
  teatro: Teatro Regio
  testo: One season in the corps de ballet.
- anno: '1988'
  luogo: Zurich
  teatro: Zurich Opera Ballet, dir. Uwe Scholz
  testo: Four seasons. From 1990 he creates his first choreographies for the Opera.
- anno: '1992'
  luogo: Lucerne
  teatro: Stadttheater
  testo: Two seasons as dancer and choreographer; in 1993 he creates a work with orchestra.
- anno: '1995'
  luogo: Zurich
  teatro: ORMA Dance Company
  testo: Founds and directs the company, supported by the City and Canton of Zurich. More than ten creations, touring Germany, France, Mauritius, Italy and Liechtenstein until 2000.
- anno: '2010'
  luogo: Catania · Acireale
  teatro: Scenario Pubblico, DANZ@M.E
  testo: Returns to Sicily. Since 2012 head of teaching for MoDem Pro and director of CZD2; assistant to Roberto Zappalà for Fra Diavolo at the Rome Opera (2017) and the Teatro Massimo in Palermo (2018).
