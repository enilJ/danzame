bio_roles: Dancer · choreographer · teacher
bio_p1: Born in Catania on 4 July 1964, he began studying classical ballet at the age of nine, between Acireale and Catania. In 1983 he moved to France for the two-year professional programme at the Centre de Danse International Rosella Hightower in Cannes.
bio_p2: Fifteen years in the opera houses of France, Italy and Switzerland followed. He danced the repertoire of Petipa, Balanchine, Bournonville and Cranko and worked with choreographers such as Uwe Scholz, Peter Schaufuss and John Clifford. He made his first choreographies in Zurich, and in 1995 founded the ORMA Dance Company.
bio_p3: He has worked with Roberto Zappalà since 1995. Back in Sicily in 2010, he leads the MoDem Pro courses and CZD2 at Scenario Pubblico in Catania, and through DANZ@M.E brings workshops, residencies and Mò.DANCEFEST to Acireale.
