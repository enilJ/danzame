feat_eyebrow: Featured · Artistic direction by C. Enrico Musmeci
feat_tagline: A platform for auteur choreography. “What is unknown seems strange.”
poster_alt: Mò.DANCEFEST 2026 poster
poster_cap: 2026 programme
feat_p1: Mò.DANCEFEST selects and presents short pieces by emerging Sicilian contemporary dance companies and by Sicilian choreographers working abroad. The works are new or reworked excerpts of recent choreographies, chosen to show audiences the styles and directions of dance today.
feat_p2: The festival is conceived and organised by DANZ@M.E and takes place in the association's own studio, La Pépinière. Alongside the evening performances there are masterclasses, choreographic labs and residencies, which end with a showing open to the public.
