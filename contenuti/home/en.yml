intro_label: The association
intro_lede: 'DANZ@M.E promotes dance in all its forms around Acireale, in Sicily: <em>performances</em>, choreographic residencies, camps and workshops.'
intro_body: It was founded by C. Enrico Musmeci, winner of the Aci &amp; Galatea Prize in 1997, after a career in the opera houses of France, Italy and Switzerland. Over the years the association has produced performances with live music, urban performances and dance theatre, and has built international exchanges to help young dancers into the profession.
