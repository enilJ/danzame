poster_alt: Plakat des Mò.DANCEFEST 2026
poster_cap: Programm 2026
feat_p1: Das Mò.DANCEFEST wählt kurze Arbeiten aufstrebender sizilianischer Compagnien des zeitgenössischen Tanzes und sizilianischer Choreografinnen und Choreografen aus, die im Ausland arbeiten, und bringt sie auf die Bühne. Die Stücke sind neu oder überarbeitete Ausschnitte aus jüngeren Choreografien und sollen dem Publikum die Stile und Strömungen des heutigen Tanzes nahebringen.
feat_p2: Das Festival wird von DANZ@M.E konzipiert und organisiert und findet im vereinseigenen Saal La Pépinière statt. Neben den Abendvorstellungen gibt es Masterclasses, choreografische Labore und Residenzen, die mit einer öffentlichen Präsentation abschließen.
