seasons_h: Spielzeiten
seasons:
- anno: '1983'
  luogo: Cannes
  teatro: Centre Rosella Hightower
  testo: Zweijährige Berufsausbildung in klassischem und modernem Tanz.
- anno: '1985'
  luogo: Nizza · Avignon · Nancy
  teatro: Opéra de Nice, Opéra d'Avignon, Ballet de Nancy
  testo: Erste Engagements an französischen Opernballetten.
- anno: '1986'
  luogo: Europa · USA
  teatro: Ballet Théâtre Populaire en Liberté, Ballet de France
  testo: Europatournee und 1987 eine USA-Tournee mit dem Ballet de France, Paris.
- anno: '1987'
  luogo: Turin
  teatro: Teatro Regio
  testo: Eine Spielzeit im Corps de ballet.
- anno: '1988'
  luogo: Zürich
  teatro: Ballett des Opernhauses Zürich, Dir. Uwe Scholz
  testo: Vier Spielzeiten. Ab 1990 entstehen seine ersten Choreografien für das Opernhaus.
- anno: '1992'
  luogo: Luzern
  teatro: Stadttheater
  testo: Zwei Spielzeiten als Tänzer und Choreograf; 1993 choreografiert er ein Werk mit Orchester.
- anno: '1995'
  luogo: Zürich
  teatro: ORMA Dance Company
  testo: Gründet und leitet die Compagnie, unterstützt von Stadt und Kanton Zürich. Bis 2000 mehr als zehn Kreationen, auf Tournee in Deutschland, Frankreich, Mauritius, Italien und Liechtenstein.
- anno: '2010'
  luogo: Catania · Acireale
  teatro: Scenario Pubblico, DANZ@M.E
  testo: Rückkehr nach Sizilien. Seit 2012 pädagogischer Leiter der Kurse MoDem Pro und Leiter der CZD2; Assistent von Roberto Zappalà für Fra Diavolo an der Oper Rom (2017) und am Teatro Massimo in Palermo (2018).
