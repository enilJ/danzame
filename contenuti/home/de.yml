bio_roles: Tänzer · Choreograf · Ballettpädagoge
bio_p1: Geboren am 4. Juli 1964 in Catania, beginnt er mit neun Jahren in Acireale und Catania mit dem klassischen Ballett. 1983 geht er nach Frankreich, für die zweijährige Berufsausbildung am Centre de Danse International Rosella Hightower in Cannes.
bio_p2: Es folgen fünfzehn Jahre an Opernhäusern in Frankreich, Italien und der Schweiz. Er tanzt das Repertoire von Petipa, Balanchine, Bournonville und Cranko und arbeitet mit Choreografen wie Uwe Scholz, Peter Schaufuss und John Clifford. In Zürich entstehen seine ersten Choreografien; 1995 gründet er die ORMA Dance Company.
bio_p3: Seit 1995 arbeitet er mit Roberto Zappalà zusammen. 2010 kehrt er nach Sizilien zurück. Er leitet die Kurse MoDem Pro und die CZD2 bei Scenario Pubblico in Catania und bringt mit DANZ@M.E Workshops, Residenzen und das Mò.DANCEFEST nach Acireale.
