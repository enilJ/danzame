intro_label: Der Verein
intro_lede: 'DANZ@M.E fördert den Tanz in all seinen Formen in und um Acireale auf Sizilien: <em>Performances</em>, choreografische Residenzen, Camps und Workshops.'
intro_body: Gegründet wurde der Verein von C. Enrico Musmeci, Träger des Preises Aci &amp; Galatea 1997, nach einer Laufbahn an den Opernhäusern Frankreichs, Italiens und der Schweiz. Seitdem hat er Aufführungen mit Livemusik, urbane Performances und Tanztheater produziert und internationale Austauschprojekte aufgebaut, die jungen Tänzerinnen und Tänzern den Einstieg in den Beruf erleichtern.
