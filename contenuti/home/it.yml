seasons_h: Stagioni
seasons:
- anno: '1983'
  luogo: Cannes
  teatro: Centre Rosella Hightower
  testo: Biennio professionale di formazione classica e moderna.
- anno: '1985'
  luogo: Nizza · Avignone · Nancy
  teatro: Opéra de Nice, Opéra d'Avignon, Ballet de Nancy
  testo: Primi contratti nelle compagnie d'opera francesi.
- anno: '1986'
  luogo: Europa · Stati Uniti
  teatro: Ballet Théâtre Populaire en Liberté, Ballet de France
  testo: Tournée europea e, nel 1987, negli Stati Uniti con il Ballet de France di Parigi.
- anno: '1987'
  luogo: Torino
  teatro: Teatro Regio
  testo: Una stagione nel corpo di ballo.
- anno: '1988'
  luogo: Zurigo
  teatro: Balletto dell'Opernhaus, dir. Uwe Scholz
  testo: Quattro stagioni. Dal 1990 crea le sue prime coreografie per l'Opera.
- anno: '1992'
  luogo: Lucerna
  teatro: Stadttheater
  testo: Due stagioni come danzatore e coreografo; nel 1993 firma una coreografia con orchestra.
- anno: '1995'
  luogo: Zurigo
  teatro: ORMA Dance Company
  testo: Fonda e dirige la compagnia, sostenuta da Città e Cantone di Zurigo. Oltre dieci creazioni in tournée tra Germania, Francia, Mauritius, Italia e Liechtenstein fino al 2000.
- anno: '2010'
  luogo: Catania · Acireale
  teatro: Scenario Pubblico, DANZ@M.E
  testo: Rientro in Sicilia. Dal 2012 direttore didattico dei corsi MoDem Pro e della CZD2; assistente di Roberto Zappalà per Fra Diavolo all'Opera di Roma (2017) e al Teatro Massimo di Palermo (2018).
