feat_tagline: Una piattaforma coreografica d'autore. «Ciò che è estraneo sembra strano».
poster_alt: Locandina del Mò.DANCEFEST 2026
poster_cap: Programma 2026
feat_p1: Il Mò.DANCEFEST seleziona e presenta brevi creazioni di compagnie siciliane emergenti di danza contemporanea e di autori siciliani che lavorano all'estero. I pezzi sono inediti o estratti rielaborati di coreografie recenti, pensati per far conoscere al pubblico gli stili e le tendenze della danza di oggi.
feat_p2: Il festival è ideato e organizzato da DANZ@M.E e si svolge nella sala dell'associazione, La Pépinière. Accanto alle serate di spettacolo ci sono masterclass, laboratori coreografici e residenze, che si chiudono con una restituzione aperta al pubblico.
