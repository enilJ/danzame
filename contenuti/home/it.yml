intro_label: L'associazione
intro_lede: 'DANZ@M.E promuove la danza nel territorio acese in tutte le sue declinazioni: <em>performance</em>, residenze coreografiche, camp e workshop.'
intro_body: Fondata da C. Enrico Musmeci, Premio Aci &amp; Galatea 1997, dopo una carriera nei teatri d'opera di Francia, Italia e Svizzera. Negli anni l'associazione ha prodotto spettacoli con musica dal vivo, performance urbane e danza teatro, e ha costruito scambi internazionali per l'inserimento professionale dei giovani danzatori.
