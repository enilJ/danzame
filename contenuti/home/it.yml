bio_roles: Danzatore · coreografo · maestro
bio_p1: Nato a Catania il 4 luglio 1964, inizia a studiare danza classica a nove anni, tra Acireale e Catania. Nel 1983 si trasferisce in Francia per il biennio professionale al Centre de Danse International Rosella Hightower di Cannes.
bio_p2: Seguono quindici anni nei teatri d'opera di Francia, Italia e Svizzera, dove danza il repertorio di Petipa, Balanchine, Bournonville e Cranko e lavora con coreografi come Uwe Scholz, Peter Schaufuss e John Clifford. A Zurigo firma le prime coreografie; nel 1995 fonda la ORMA Dance Company.
bio_p3: Dal 1995 collabora con Roberto Zappalà. Tornato in Sicilia nel 2010, dirige i corsi MoDem Pro e la CZD2 a Scenario Pubblico, e con DANZ@M.E porta ad Acireale workshop, residenze e il Mò.DANCEFEST.
