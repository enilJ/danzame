<!doctype html>
<html lang="[[lang]]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[[page_title]] · danz@m.e</title>
[[hreflang]]
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F2F3F6; --paper-2:#E7E9EF; --ink:#12141A; --muted:#5A6072; --rule:#D3D7E0;
  --accent:#2436D2; --swiss:#8A93AD;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter:clamp(16px,4vw,48px);
  --wrap:1180px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D0F15; --paper-2:#161922; --ink:#ECEEF3; --muted:#959CAE; --rule:#272C39; --accent:#8492FF; --swiss:#4E566D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D0F15; --paper-2:#161922; --ink:#ECEEF3; --muted:#959CAE; --rule:#272C39; --accent:#8492FF; --swiss:#4E566D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.05}
p{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-family:var(--display);font-size:24px;text-decoration:none;letter-spacing:-.01em}
.brand b{font-weight:400;color:var(--accent)}
.nav{display:flex;gap:clamp(14px,2.4vw,32px);flex-wrap:wrap;justify-content:flex-end}
.nav a{font-size:14px;font-weight:500;text-decoration:none;color:var(--muted)}
.nav a:hover,.nav a[aria-current]{color:var(--ink)}
.langs{display:flex;gap:2px;margin-left:clamp(4px,1vw,12px);padding-left:clamp(10px,1.6vw,20px);border-left:1px solid var(--rule)}
.langs a{font-family:var(--mono);font-size:12px!important;letter-spacing:.06em;text-transform:uppercase;padding:2px 4px}
.langs a[aria-current]{color:var(--ink)}
@media (max-width:640px){.nav a.opt{display:none}}
@media (max-width:480px){.brand{font-size:20px}.nav{gap:12px}.nav a{font-size:13px}}
@media (max-width:640px){
  .site-head .wrap{flex-wrap:wrap;row-gap:8px;padding-block:10px}
  .nav{order:3;width:100%;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;gap:16px;scrollbar-width:none}
  .nav a{white-space:nowrap}
  .langs{margin-left:auto}
}


/* ---------- index ---------- */
.intro{padding-block:clamp(48px,8vw,96px) 0}
.intro h1{font-size:clamp(56px,10vw,132px);letter-spacing:-.03em;line-height:.92}
.intro .sub{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;font-size:15px}
.intro .sub b{font-family:var(--display);font-weight:400;font-size:28px;margin-right:6px;font-variant-numeric:lining-nums}

.strip{margin-top:clamp(36px,5vw,56px)}
.strip-scroll{overflow-x:auto;padding-bottom:4px}
.strip svg{display:block;width:100%;min-width:620px;height:auto}
.strip .legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;font-size:13px;color:var(--muted)}
.strip .legend i{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px}
.bar{cursor:pointer}
.bar:hover rect{opacity:.75}

.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-top:clamp(32px,5vw,48px)}
.tools .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--sans);padding:8px 12px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:999px}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:720px){.tools{position:static}}
.search{flex:1 1 200px;display:flex;justify-content:flex-end}
.search input{width:100%;max-width:280px;font:15px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:6px 2px}
.search input::placeholder{color:var(--muted)}

.decade{padding-block:clamp(36px,6vw,64px) 0}
.decade-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.decade-head h2{font-size:clamp(36px,5vw,58px);letter-spacing:-.02em}
.decade-head h2 em{font-style:italic;color:var(--accent)}
.decade-head p{max-width:40ch;text-align:right;font-size:14px;color:var(--muted)}
@media (max-width:640px){.decade-head{flex-direction:column;align-items:flex-start}.decade-head p{text-align:left}}
.rep{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.rep li{border-bottom:1px solid var(--rule)}
.rep a{display:grid;grid-template-columns:64px minmax(0,1.3fr) minmax(0,1fr) 92px;gap:8px 20px;align-items:baseline;padding-block:14px;text-decoration:none}
.rep a:hover .t{color:var(--accent)}
.rep .yr{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rep .t{font-family:var(--display);font-size:clamp(21px,2.3vw,27px);line-height:1.15;transition:color .15s}
.rep .d{font-size:14px;color:var(--muted)}
.rep .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap}
.rep .k::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;vertical-align:1px;background:var(--dot,var(--rule))}
.rep .k[data-p="Sicilia"]{--dot:var(--accent)}
.rep .k[data-p="Svizzera"]{--dot:var(--swiss)}
.rep .k[data-p="Altrove"]::before{background:transparent;border:1px solid var(--muted)}
@media (max-width:720px){
  .rep a{grid-template-columns:48px minmax(0,1fr)}
  .rep .d,.rep .k{grid-column:2;text-align:left}
}
.empty{padding-block:48px;color:var(--muted)}

/* ---------- scheda ---------- */
.work{padding-block:clamp(32px,5vw,56px) clamp(56px,8vw,96px)}
.back{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.work-top{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,5vw,72px);margin-top:clamp(28px,4vw,48px);align-items:end}
@media (max-width:860px){.work-top{grid-template-columns:1fr}}
.work h1{font-size:clamp(48px,8vw,112px);letter-spacing:-.03em;line-height:.95;overflow-wrap:anywhere}
.credits{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0;font-size:15px}
.credits dt{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.credits dd{margin:0}

.gallery{column-count:3;column-gap:clamp(8px,1.2vw,16px);margin-top:clamp(36px,5vw,56px)}
.gallery.n1{column-count:1;max-width:900px}
.gallery.n2{column-count:2}
@media (max-width:860px){.gallery{column-count:2}}
@media (max-width:520px){.gallery,.gallery.n2{column-count:1}}
.gallery button{display:block;width:100%;padding:0;border:0;margin:0 0 clamp(8px,1.2vw,16px);background:var(--paper-2);cursor:zoom-in;break-inside:avoid}
.gallery img{width:100%;height:auto}
.photo-credit{margin-top:6px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(7,8,12,.94);display:grid;grid-template-rows:1fr auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lightbox img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;min-height:0}
.lightbox .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#C9CDD8;font:13px var(--mono);padding-top:12px}
.lightbox button{font:500 14px var(--sans);color:#F4F5F8;background:transparent;border:1px solid #3A3F4C;border-radius:999px;padding:8px 14px;cursor:pointer}
.lightbox .nav-btns{display:flex;gap:8px}
.pending{margin-top:clamp(36px,5vw,56px);border:1px dashed var(--muted);padding:28px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--rule) 55%,transparent) 14px 15px)}
.pending p{font-family:var(--display);font-size:22px}

.work-body{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:clamp(20px,4vw,64px);margin-top:clamp(48px,7vw,80px);padding-top:28px;border-top:1px solid var(--rule)}
@media (max-width:760px){.work-body{grid-template-columns:1fr}}
.work-body + .work-body{margin-top:0}
.dates{list-style:none;margin:0;padding:0}
.dates li{padding-block:8px;border-bottom:1px solid var(--rule);font-size:15px}
.dates li:first-child{padding-top:0}
blockquote{margin:0;max-width:34ch}
blockquote p{font-family:var(--display);font-style:italic;font-size:clamp(22px,2.6vw,30px);line-height:1.35}
blockquote .tr{font-family:var(--sans);font-style:normal;font-size:16px;line-height:1.55;color:var(--muted);margin-top:14px;max-width:52ch}
blockquote footer{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.notes p{max-width:62ch}
.notes p + p{margin-top:.8em}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:clamp(56px,8vw,96px);border-top:1px solid var(--ink)}
.pager a{display:grid;gap:4px;padding-block:18px;text-decoration:none}
.pager a:last-child{text-align:right}
.pager span:last-child{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);line-height:1.15}
.pager a:hover span:last-child{color:var(--accent)}

footer.site{background:#0A0B10;color:#E6E8EE;padding-block:40px}
footer.site .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:#8D93A5}
footer.site em{font-family:var(--display);font-size:22px;color:#E6E8EE}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">danz<b>@</b>m.e</a>
    <nav class="nav" aria-label="[[nav_label]]">
      <a href="coreografie.html" aria-current="page">[[nav_works]]</a>
      <a href="index.html#festival">Mò.DANCEFEST</a>
      <a href="index.html#biografia">[[nav_bio]]</a>
      <a class="opt" href="index.html#contatti">[[nav_contact]]</a>
      [[langswitch]]
    </nav>
  </div>
</header>

<main>
  <div id="index-view">
    <div class="wrap intro">
      <span class="label">[[eyebrow]]</span>
      <h1 style="margin-top:12px">[[h1]]</h1>
      <div class="sub muted" id="summary"></div>
      <figure class="strip" style="margin-inline:0">
        <div class="strip-scroll"><svg id="strip" role="img" aria-labelledby="strip-t"></svg></div>
        <figcaption class="legend" id="strip-t">
          <span><i style="background:var(--swiss)"></i>[[pl_sv]]</span>
          <span><i style="background:var(--accent)"></i>[[pl_si]]</span>
          <span><i style="border:1px solid var(--muted)"></i>[[pl_al]]</span>
          <span>[[legend_note]]</span>
        </figcaption>
      </figure>
    </div>

    <div class="tools">
      <div class="wrap">
        <div class="chips" role="group" aria-label="[[f_period]]" id="f-decade"></div>
        <div class="chips" role="group" aria-label="[[f_place]]" id="f-place"></div>
        <label class="search"><span class="label" hidden>[[search]]</span><input id="q" type="search" placeholder="[[search_ph]]" autocomplete="off"></label>
      </div>
    </div>

    <div class="wrap" id="list"></div>
  </div>

  <article id="work-view" class="wrap work" hidden></article>
</main>

<footer class="site">
  <div class="wrap"><em>[[motto]]</em><span>[[footer_assoc]]</span></div>
</footer>

<script>
const WORKS = /*DATA*/;
const PHOTOS = /*PHOTOS*/;
const T = /*T*/;

const DECADES = T.decades.map((d,i) => ({...d, from:[2020,2010,2000,1990][i], to:[2029,2019,2009,1999][i]}));
const PLACES = ["Svizzera","Sicilia","Altrove"];
// il luogo arriva già calcolato dai dati

const byYear = [...WORKS].sort((a,b) => (a.anno-b.anno) || a.titolo.localeCompare(b.titolo));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const state = {decade:"all", place:"all", q:""};

/* ---- summary ---- */
(function(){
  const years = WORKS.map(w=>w.anno);
  const cities = PLACES.map(p => [p, WORKS.filter(w=>w.place===p).length]);
  document.getElementById("summary").innerHTML =
    `<span><b>${WORKS.length}</b>${T.works_word}</span><span><b>${Math.min(...years)}–${Math.max(...years)}</b></span>` +
    cities.map(([p,n]) => `<span><b>${n}</b>${T.in_place[p]}</span>`).join("");
})();

/* ---- timeline strip ---- */
(function(){
  const svg = document.getElementById("strip");
  const y0 = 1991, y1 = Math.max(...WORKS.map(w => w.anno)), n = y1 - y0 + 1;
  const counts = {};
  WORKS.forEach(w => { (counts[w.anno] ??= {Svizzera:0,Sicilia:0,Altrove:0})[w.place]++; });
  const max = Math.max(...Object.values(counts).map(c => c.Svizzera+c.Sicilia+c.Altrove));
  const W = 1000, H = 150, top = 8, base = 118, colW = W / n, bw = colW * .62, unit = (base - top) / max;
  let out = "";
  for (let k = 1; k <= max; k++) out += `<line x1="0" x2="${W}" y1="${base - k*unit}" y2="${base - k*unit}" stroke="var(--rule)" stroke-width="1"/>`;
  for (let i = 0; i < n; i++){
    const yr = y0 + i, c = counts[yr], x = i*colW + (colW-bw)/2;
    let y = base, g = "";
    if (c) for (const p of ["Svizzera","Sicilia","Altrove"]) {
      if (!c[p]) continue;
      const h = c[p]*unit - 1.5; y -= c[p]*unit;
      g += p === "Altrove"
        ? `<rect x="${x+.5}" y="${y+.5}" width="${bw-1}" height="${h-1}" fill="none" stroke="var(--muted)"/>`
        : `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="var(--${p==="Svizzera"?"swiss":"accent"})"/>`;
    }
    const tot = c ? c.Svizzera+c.Sicilia+c.Altrove : 0;
    out += `<g class="bar" data-year="${yr}"><title>${yr}: ${tot} ${tot===1?T.premiere_one:T.premiere_many}</title><rect x="${i*colW}" y="0" width="${colW}" height="${H}" fill="transparent"/>${g}</g>`;
    if (yr % 5 === 0 || yr === y0) out += `<text x="${i*colW + colW/2}" y="${base+22}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--muted)">${yr}</text>`;
  }
  out += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width="1"/>`;
  // rientro in Sicilia
  const xr = (2010 - y0) * colW;
  out += `<line x1="${xr}" x2="${xr}" y1="${top}" y2="${base}" stroke="var(--ink)" stroke-dasharray="2 3"/><text x="${xr+6}" y="${top+10}" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)">${T.return_note}</text>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out;
  svg.addEventListener("click", e => {
    const g = e.target.closest(".bar"); if (!g) return;
    state.decade = "all"; state.place = "all"; state.q = ""; document.getElementById("q").value = "";
    renderFilters(); renderList();
    const row = document.querySelector(`[data-y="${g.dataset.year}"]`) || [...document.querySelectorAll("[data-y]")].find(r => +r.dataset.y > +g.dataset.year);
    row?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
  });
})();

/* ---- filters ---- */
function renderFilters(){
  const dec = document.getElementById("f-decade"), pl = document.getElementById("f-place");
  dec.innerHTML = [["all",T.all], ...DECADES.map(d => [d.id, d.chip])]
    .map(([id,l]) => `<button class="chip" id="dec-${id}" data-dec="${id}" aria-pressed="${state.decade===id}">${l}</button>`).join("");
  pl.innerHTML = [["all",T.everywhere], ...PLACES.map(p => [p,T.places[p]])]
    .map(([id,l]) => `<button class="chip" id="pl-${id}" data-pl="${id}" aria-pressed="${state.place===id}">${l}</button>`).join("");
}
document.getElementById("f-decade").addEventListener("click", e => { const b = e.target.closest("[data-dec]"); if (!b) return; state.decade = b.dataset.dec; renderFilters(); renderList(); });
document.getElementById("f-place").addEventListener("click", e => { const b = e.target.closest("[data-pl]"); if (!b) return; state.place = b.dataset.pl; renderFilters(); renderList(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); renderList(); });

function detail(w){
  return [w.organico, w.compagnia && (/^(solo|duo)$/i.test(w.organico) ? T.k_for.toLowerCase() + " " : "") + w.compagnia].filter(Boolean).join(" · ")
    || w.prima;
}

function renderList(){
  const list = document.getElementById("list");
  const match = w =>
    (state.place === "all" || w.place === state.place) &&
    (!state.q || [w.titolo, w.compagnia, w.musica, w.prima, w.organico].join(" ").toLowerCase().includes(state.q));
  let html = "";
  for (const d of DECADES){
    if (state.decade !== "all" && state.decade !== d.id) continue;
    const ws = WORKS.filter(w => w.anno >= d.from && w.anno <= d.to && match(w))
                    .sort((a,b) => (b.anno-a.anno) || a.titolo.localeCompare(b.titolo));
    if (!ws.length) continue;
    const a = d.a, b = d.b;
    html += `<section class="decade" aria-labelledby="h-${d.id}">
      <div class="decade-head"><h2 id="h-${d.id}">${a} <em>${b}</em></h2><p>${d.note}</p></div>
      <ul class="rep">${ws.map(w => `<li data-y="${w.anno}"><a href="#${w.slug}">
        <span class="yr">${w.anno}</span><span class="t">${esc(w.titolo)}</span>
        <span class="d">${esc(detail(w))}</span><span class="k" data-p="${w.place}">${T.places[w.place]}</span></a></li>`).join("")}</ul>
    </section>`;
  }
  list.innerHTML = html || `<p class="empty">${T.empty}</p>`;
}

/* ---- scheda ---- */
function renderWork(w){
  const i = byYear.indexOf(w), prev = byYear[i-1], next = byYear[i+1];
  const credits = [
    [T.k_preview, w.anteprima], [T.k_premiere, w.prima], [T.k_cast, w.organico],
    [/^(solo|duo|assolo)/i.test(w.organico) ? T.k_for : T.k_company, w.compagnia], [T.k_music, w.musica]
  ].filter(([,v]) => v);
  const local = PHOTOS[w.slug] || [];
  let photos = "";
  if (local.length) {
    const cls = local.length === 1 ? " n1" : local.length === 2 ? " n2" : "";
    photos = `<div class="gallery${cls}">${local.map((p,k) => `<button type="button" data-k="${k}" aria-label="${T.enlarge.replace("{k}",k+1).replace("{n}",local.length)}"><img loading="lazy" src="${p.src}" width="${p.w}" height="${p.h}" alt="${esc(T.photo_alt.replace("{t}",w.titolo).replace("{k}",k+1))}"></button>`).join("")}</div>` +
      (w.crediti.length ? `<p class="label photo-credit">${T.photo}: ${esc(w.crediti.join(", "))}</p>` : "");
  }
  const dates = (title, arr) => arr.length ? `<div class="work-body"><span class="label">${title}</span><ul class="dates">${arr.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : "";
  const quotes = w.citazioni.length ? `<div class="work-body"><span class="label">${T.press}</span><div>${w.citazioni.map(c =>
      `<blockquote><p>«${esc(c.testo)}»</p>${c.traduzione ? `<p class="tr">${esc(c.traduzione)}</p>` : ""}${c.fonte ? `<footer>${esc(c.fonte)}</footer>` : ""}</blockquote>`).join("")}</div></div>` : "";
  const notes = w.note.length ? `<div class="work-body"><span class="label">${T.notes}</span><div class="notes">${w.note.map(n => `<p>${esc(n)}</p>`).join("")}</div></div>` : "";
  const view = document.getElementById("work-view");
  view.innerHTML = `
    <a class="back" href="#">${T.back}</a>
    <div class="work-top">
      <div><span class="label">${w.anno} · ${T.places[w.place]}</span><h1 style="margin-top:14px">${esc(w.titolo)}</h1></div>
      <dl class="credits">${credits.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}<dt>${T.choreo_by}</dt><dd>C. Enrico Musmeci</dd></dl>
    </div>
    ${photos}${quotes}${dates(T.upcoming, w.prossimamente)}${dates(T.reruns, w.repliche)}${notes}
    <nav class="pager" aria-label="${T.pager}">
      ${prev ? `<a href="#${prev.slug}"><span class="label">← ${prev.anno}</span><span>${esc(prev.titolo)}</span></a>` : "<span></span>"}
      ${next ? `<a href="#${next.slug}"><span class="label">${next.anno} →</span><span>${esc(next.titolo)}</span></a>` : "<span></span>"}
    </nav>`;
  document.title = `${w.titolo} · danz@m.e`;
}


/* ---- ingrandimento foto ---- */
let lbList = [], lbIdx = 0, lbEl = null, lbReturn = null;
function lbShow(){
  const p = lbList[lbIdx];
  lbEl.querySelector("img").src = p.src;
  lbEl.querySelector(".count").textContent = `${lbIdx+1} / ${lbList.length}`;
}
function lbOpen(list, k, from){
  lbList = list; lbIdx = k; lbReturn = from;
  lbEl = document.createElement("div");
  lbEl.className = "lightbox"; lbEl.setAttribute("role","dialog"); lbEl.setAttribute("aria-modal","true");
  lbEl.innerHTML = `<img alt=""><div class="bar"><span class="count"></span><div class="nav-btns">
    <button type="button" data-a="prev">←</button><button type="button" data-a="next">→</button><button type="button" data-a="close">${T.close}</button></div></div>`;
  document.body.append(lbEl); lbShow();
  lbEl.querySelector('[data-a="close"]').focus();
  lbEl.addEventListener("click", e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "prev") { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbShow(); }
    else if (a === "next") { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); }
    else if (a === "close" || e.target === lbEl) lbClose();
  });
}
function lbClose(){ lbEl?.remove(); lbEl = null; lbReturn?.focus(); }
addEventListener("keydown", e => {
  if (!lbEl) return;
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowRight") { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); }
  if (e.key === "ArrowLeft") { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbShow(); }
});
document.getElementById("work-view").addEventListener("click", e => {
  const b = e.target.closest(".gallery button"); if (!b) return;
  const w = WORKS.find(x => x.slug === location.hash.slice(1));
  lbOpen(PHOTOS[w.slug], +b.dataset.k, b);
});

let lastScroll = 0;
function route(){
  if (lbEl) lbClose();
  const slug = location.hash.slice(1);
  const w = WORKS.find(x => x.slug === slug);
  const idx = document.getElementById("index-view"), wv = document.getElementById("work-view");
  if (w){
    if (!idx.hidden) lastScroll = scrollY;
    renderWork(w); idx.hidden = true; wv.hidden = false; scrollTo(0,0);
  } else {
    const wasWork = !wv.hidden;
    wv.hidden = true; idx.hidden = false; document.title = `${T.page_title} · danz@m.e`;
    if (wasWork) requestAnimationFrame(() => scrollTo(0, lastScroll));
  }
}
addEventListener("hashchange", route);
renderFilters(); renderList(); route();
</script>
